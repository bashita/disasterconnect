<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ role|capitalize }} Login - Disaster Response</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
      /* ==========================================================================
         1. CORE THEME & RESET
         ========================================================================== */
      :root {
        --primary: #F59E0B;
        --primary-hover: #FBBF24;
        --primary-dark: #D97706;
        --bg-dark: #0B1120;
        --card-bg: rgba(255, 255, 255, 0.04);
        --card-border: rgba(245, 158, 11, 0.2);
        --text-main: #F8FAFC;
        --text-muted: #CBD5E1;
        --input-bg: rgba(15, 23, 42, 0.7);
        --danger: #EF4444;
        --success: #10B981;
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-dark);
        background-image: 
          radial-gradient(circle at 85% 20%, rgba(245, 158, 11, 0.05) 0%, transparent 45%),
          radial-gradient(circle at 15% 80%, rgba(59, 130, 246, 0.04) 0%, transparent 45%);
        background-attachment: fixed;
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Card Styling */
      .card {
        background: var(--card-bg) !important;
        border: 1px solid var(--card-border) !important;
        backdrop-filter: blur(16px);
        border-radius: 20px !important;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4) !important;
        overflow: hidden;
      }

      .card-header {
        background: rgba(15, 23, 42, 0.6) !important;
        border-bottom: 1px solid rgba(245, 158, 11, 0.15) !important;
        padding: 1.5rem !important;
      }

      .card-header h3 {
        font-family: 'Outfit', sans-serif;
        font-weight: 700;
        color: var(--text-main);
        margin: 0;
      }

      /* Form Labels & Inputs */
      .form-label {
        color: var(--text-muted);
        font-weight: 500;
        font-size: 0.875rem;
      }

      .form-control {
        background: var(--input-bg) !important;
        border: 1px solid var(--card-border) !important;
        color: var(--text-main) !important;
        border-radius: 12px !important;
        padding: 0.75rem 1rem !important;
        font-size: 0.95rem;
        transition: all 0.3s ease;
      }

      .form-control:focus {
        border-color: var(--primary) !important;
        box-shadow: 0 0 12px rgba(245, 158, 11, 0.25) !important;
        outline: none;
      }

      .form-control::placeholder {
        color: rgba(203, 213, 225, 0.4);
      }

      /* Buttons */
      .btn-primary {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%) !important;
        border: none !important;
        color: var(--bg-dark) !important;
        font-family: 'Outfit', sans-serif;
        font-weight: 700;
        border-radius: 12px !important;
        padding: 0.8rem 1.5rem !important;
        box-shadow: 0 4px 15px rgba(245, 158, 11, 0.25);
        transition: all 0.3s ease !important;
      }

      .btn-primary:hover {
        background: linear-gradient(135deg, var(--primary-hover) 0%, var(--primary) 100%) !important;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
      }

      /* Flash Alerts Overrides */
      .alert {
        border-radius: 12px;
        font-size: 0.875rem;
        font-weight: 500;
        border: 1px solid transparent;
      }

      .alert-danger, .alert-error {
        background: rgba(239, 68, 68, 0.15) !important;
        border-color: rgba(239, 68, 68, 0.3) !important;
        color: #FCA5A5 !important;
      }

      .alert-success {
        background: rgba(16, 185, 129, 0.15) !important;
        border-color: rgba(16, 185, 129, 0.3) !important;
        color: #6EE7B7 !important;
      }

      .alert-info, .alert-warning {
        background: rgba(245, 158, 11, 0.15) !important;
        border-color: rgba(245, 158, 11, 0.3) !important;
        color: var(--primary-hover) !important;
      }
    </style>
</head>
<body>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-6 col-lg-5">
            <div class="card">
                <div class="card-header text-center">
                    <h3><i class="fa-solid fa-shield-halved me-2" style="color: var(--primary);"></i>{{ role|capitalize }} Login</h3>
                </div>
                <div class="card-body p-4 p-md-5">
                    
                    <!-- Flash messages for errors/success -->
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ category }} mb-4" role="alert">
                                    <i class="fa-solid fa-circle-info me-2"></i>{{ message }}
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <form action="" method="POST">
                        <div class="mb-4">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mt-2">Login</button>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
